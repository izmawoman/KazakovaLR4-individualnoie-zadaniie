
{% load static %}

<!-- Объявление типа документа HTML5 -->
<!DOCTYPE html>

<!-- Корневой элемент HTML-документа;
     lang="ru" указывает, что основным языком страницы является русский -->
<html lang="ru">
<head>
    <!-- Указание кодировки UTF-8 для корректного отображения русскоязычного текста -->
    <meta charset="UTF-8">

    <!-- Настройка адаптивного отображения страницы на мобильных устройствах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Заголовок страницы;
         дочерние шаблоны могут переопределять содержимое блока title -->
    <title>{% block title %}Smart Card Security{% endblock %}</title>

    <!-- Подключение основного CSS-файла проекта из каталога static -->
    <link rel="stylesheet" href="{% static 'tasks/styles.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Внешний контейнер всей страницы, управляющий общей компоновкой интерфейса -->
    <div class="page-shell">
        <!-- Верхняя панель сайта с брендом и навигацией -->
        <header class="topbar">
            <!-- Блок логотипа и названия системы -->
            <div class="brand-block">
                <!-- Краткий графический маркер или текстовый логотип системы -->
                <div class="brand-mark">SC</div>

                <!-- Контейнер для названия и подзаголовка системы -->
                <div>
                    <!-- Основное название приложения -->
                    <div class="brand-title">Smart Card Security</div>

                    <!-- Подзаголовок с описанием назначения системы -->
                    <div class="brand-subtitle">Система контроля доступа и анализа угроз</div>
                </div>
            </div>

            <!-- Основное навигационное меню приложения -->
            <nav class="topnav">
                <!-- Ссылка на страницу идентификации пользователя -->
                <a href="{% url 'identify' %}">Вход</a>

                <!-- Ссылка на страницу панели рисков -->
                <a href="{% url 'dashboard' %}">Риски</a>

                <!-- Ссылка на страницу журнала безопасности -->
                <a href="{% url 'logs' %}">Логи</a>

                <!-- Ссылка на выход из системы;
                     дополнительный класс используется для визуального выделения опасного действия -->
                <a href="{% url 'logout' %}" class="nav-danger">Выход</a>
            </nav>
        </header>

        <!-- Основной контейнер содержимого страницы -->
        <main class="main-container">
       
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
